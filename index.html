<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 人相性格診断 | あなたの運命を読み解く</title>
    
    <!-- 同じフォルダの icon.svg。ドメイン直下でもサブフォルダでも相対パスで読む -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- PWA用のメタタグ (iOS/Android対応) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI人相鑑定">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .video-container {
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #video,
        #shot {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video {
            transform: scaleX(-1);
            background: #000;
        }

        #guide {
            position: absolute;
            z-index: 30;
            top: 50%;
            left: 50%;
            width: min(16rem, 78%);
            height: min(20rem, 86%);
            transform: translate(-50%, -50%);
            border: 3px solid rgba(52, 211, 153, 0.95);
            border-radius: 9999px;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.5);
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, #10B981, transparent);
            box-shadow: 0 0 20px 5px rgba(16, 185, 129, 0.6);
            animation: scan 3s infinite ease-in-out;
            display: none;
            z-index: 20;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        #diagnosisContent {
            font-style: normal;
        }
        #diagnosisContent h3 {
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            font-style: normal;
            color: #6ee7b7;
        }
        #diagnosisContent h3:first-child {
            margin-top: 0;
        }
        #diagnosisContent p {
            margin-bottom: 0.75rem;
        }
        #captureBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="max-w-md w-full space-y-8">
        <!-- ヘッダー：SVGアイコンを統合 -->
        <header class="text-center space-y-4">
            <div class="flex justify-center">
                <div class="w-28 h-28 relative">
                    <!-- 同じフォルダの icon.svg（キャッシュ対策に ?v=1） -->
                    <img src="icon.svg?v=1" alt="App Icon" class="w-full h-full drop-shadow-2xl">
                </div>
            </div>
            <h1 class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-blue-500">
                AI 人相鑑定
            </h1>
            <p class="text-slate-400 text-sm">顔を撮影して、運命の解析を開始してください</p>
        </header>

        <!-- カメラセクション -->
        <div class="video-container glass-panel aspect-[4/5] flex items-center justify-center relative">
            <video id="video" autoplay playsinline muted class="rounded-2xl"></video>
            <img id="shot" alt="" class="hidden rounded-2xl">
            <canvas id="canvas" class="hidden"></canvas>
            <div id="scanLine" class="scan-line"></div>
            <div id="guide" class="pointer-events-none flex flex-col items-center justify-end pb-6">
                <span class="text-xs text-emerald-100 font-bold tracking-wide">顔を枠内に</span>
            </div>
        </div>

        <input id="cameraFile" type="file" accept="image/*" capture="user" class="hidden">
        <button type="button" id="openCamera" class="hidden w-full bg-white/10 text-emerald-100 font-bold py-4 rounded-2xl border border-emerald-400/40">カメラで撮影</button>

        <p id="cameraStatus" class="hidden text-center text-sm text-rose-300"></p>

        <div class="flex flex-col gap-4">
            <button id="captureBtn" disabled class="w-full bg-gradient-to-r from-emerald-500 to-blue-600 hover:scale-[1.02] text-white font-bold py-5 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                </svg>
                運命をスキャンする
            </button>
        </div>

        <!-- ローディング -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-8 space-y-4">
            <div class="relative w-12 h-12">
                <div class="absolute inset-0 rounded-full border-4 border-emerald-500/20"></div>
                <div class="absolute inset-0 rounded-full border-4 border-t-emerald-500 animate-spin"></div>
            </div>
            <p class="text-emerald-400 font-bold loading-dots tracking-tighter">AIが表情の深層を解析中</p>
        </div>

        <!-- 結果表示 -->
        <div id="resultArea" class="hidden glass-panel rounded-3xl p-6 border border-emerald-500/20 shadow-2xl animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                <h2 class="text-xl font-bold text-emerald-400">鑑定レポート</h2>
            </div>
            <div id="diagnosisContent" class="space-y-4 text-slate-200 leading-relaxed">
                <!-- ここに結果が表示されます -->
            </div>
            <button id="resetBtn" class="mt-8 w-full py-3 bg-white/5 hover:bg-white/10 rounded-xl text-slate-400 text-sm transition-all border border-white/5">
                新しく鑑定する
            </button>
        </div>
        
        <footer class="text-center pb-8 opacity-40">
            <p class="text-[10px] uppercase tracking-[0.2em]">Authentic AI Physiognomy Analyzer</p>
        </footer>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const resultArea = document.getElementById('resultArea');
        const diagnosisContent = document.getElementById('diagnosisContent');
        const loading = document.getElementById('loading');
        const scanLine = document.getElementById('scanLine');
        const resetBtn = document.getElementById('resetBtn');
        const cameraStatus = document.getElementById('cameraStatus');

        function showStatus(message) {
            if (!message) {
                cameraStatus.textContent = '';
                cameraStatus.classList.add('hidden');
                return;
            }
            cameraStatus.textContent = message;
            cameraStatus.classList.remove('hidden');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderReport(text) {
            const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
            const html = [];
            let paragraph = [];

            function flushParagraph() {
                if (!paragraph.length) return;
                const body = paragraph.join('<br>');
                html.push('<p>' + body + '</p>');
                paragraph = [];
            }

            lines.forEach((line) => {
                const trimmed = line.trim();
                const heading = trimmed
                    .replace(/^#{1,6}\s*/, '')
                    .replace(/^\*\*(.+)\*\*$/, '$1')
                    .replace(/^\*(.+)\*$/, '$1');
                const namedHeading = /^(顔から読み取れる性格|いまの運気|これからへのアドバイス)[：:]?$/.test(heading);
                const numberedHeading = /^[1-3１-３][.．、]\s*\S/.test(trimmed) && trimmed.length <= 40;
                const isHeading = /^#{1,6}\s+\S/.test(trimmed) || namedHeading || numberedHeading;
                if (!trimmed) {
                    flushParagraph();
                    return;
                }
                if (isHeading) {
                    flushParagraph();
                    const label = heading.replace(/^[1-3１-３][.．、]\s*/, '');
                    html.push('<h3>' + escapeHtml(label) + '</h3>');
                    return;
                }
                paragraph.push(escapeHtml(trimmed).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'));
            });
            flushParagraph();
            diagnosisContent.innerHTML = html.join('') || '<p>鑑定結果が得られませんでした。</p>';
        }

        function enableFileCamera() {
            document.getElementById('openCamera').classList.remove('hidden');
        }

        function useShot(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const maxWidth = 960;
                    const scale = img.width > maxWidth ? maxWidth / img.width : 1;
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const context = canvas.getContext('2d');
                    context.setTransform(1, 0, 0, 1, 0, 0);
                    context.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const shot = document.getElementById('shot');
                    shot.src = canvas.toDataURL('image/jpeg', 0.85);
                    shot.classList.remove('hidden');
                    video.classList.add('hidden');
                    stillReady = true;
                    captureBtn.disabled = false;
                    showStatus('');
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        async function initCamera() {
            const fileInput = document.getElementById('cameraFile');
            const openCamera = document.getElementById('openCamera');
            openCamera.addEventListener('click', () => {
                fileInput.setAttribute('capture', 'user');
                fileInput.click();
            });
            fileInput.addEventListener('change', () => useShot(fileInput.files && fileInput.files[0]));
            const liveOk = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
            if (!liveOk) {
                enableFileCamera();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                const enable = () => {
                    if (video.videoWidth > 0) captureBtn.disabled = false;
                };
                if (video.readyState >= 1) enable();
                video.addEventListener('loadedmetadata', enable, { once: true });
                showStatus('');
            } catch (err) {
                captureBtn.disabled = true;
                enableFileCamera();
                showStatus('カメラの許可が必要です。撮影ボタンから顔写真を選んでください。');
            }
        }

        let stillReady = false;

        function captureFrame() {
            if (stillReady && canvas.width > 0) {
                const stillUrl = canvas.toDataURL('image/jpeg', 0.85);
                const stillImage = stillUrl.split(',')[1];
                return stillImage || null;
            }
            const width = video.videoWidth;
            const height = video.videoHeight;
            if (!width || !height) return null;
            const maxWidth = 960;
            const scale = width > maxWidth ? maxWidth / width : 1;
            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            const context = canvas.getContext('2d');
            context.setTransform(-1, 0, 0, 1, canvas.width, 0);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            const base64 = dataUrl.split(',')[1];
            return base64 || null;
        }

        async function analyzeFace(base64Image) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 50000);
            try {
                // ドメイン直下でもサブフォルダでも動く相対パス。ルート絶対パスは使わない
                const response = await fetch('api/analyze.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image, mimeType: 'image/jpeg' }),
                    signal: controller.signal
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.text) {
                    throw new Error(data.error || '通信エラーが発生しました。');
                }
                return data.text;
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    throw new Error('鑑定に時間がかかりすぎました。もう一度お試しください。');
                }
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        function showResult(message, isError) {
            loading.classList.add('hidden');
            scanLine.style.display = 'none';
            if (isError) {
                diagnosisContent.innerHTML = '<p>' + escapeHtml(message) + '</p>';
            } else {
                renderReport(message);
            }
            resultArea.classList.remove('hidden');
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }

        captureBtn.addEventListener('click', async () => {
            const base64Image = captureFrame();
            if (!base64Image) {
                showStatus('カメラの映像がまだ準備できていません。少し待ってから、もう一度押してください。');
                return;
            }
            captureBtn.disabled = true;
            captureBtn.style.display = 'none';
            showStatus('');
            scanLine.style.display = 'block';
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                const diagnosis = await analyzeFace(base64Image);
                showResult(diagnosis, false);
            } catch (err) {
                showResult(err.message || '鑑定できませんでした。', true);
            }
        });

        resetBtn.addEventListener('click', () => {
            resultArea.classList.add('hidden');
            diagnosisContent.innerHTML = '';
            captureBtn.style.display = 'flex';
            captureBtn.disabled = !(video.videoWidth > 0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        window.onload = function () {
            try {
                var pendingId = sessionStorage.getItem('ninsougaku_pending_id');
                var pendingPassword = sessionStorage.getItem('ninsougaku_pending_password');
                if (pendingId && pendingPassword) {
                    localStorage.setItem('ninsougaku_login_id', pendingId);
                    localStorage.setItem('ninsougaku_login_password', pendingPassword);
                    sessionStorage.removeItem('ninsougaku_pending_id');
                    sessionStorage.removeItem('ninsougaku_pending_password');
                }
            } catch (err) {}
            initCamera();
        };
    </script>
</body>
</html>
